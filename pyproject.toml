[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "geosentry"
version = "0.1.0"
description = "GeoSentry：本机 SEO/GEO 全站审计 + RAG 知识背板（纯标准库）"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []   # 核心零依赖：纯标准库可跑

[project.optional-dependencies]
# 可选加速/增强（不装不影响 index/search）
numpy = ["numpy>=1.24"]
crawl = ["trafilatura>=1.8"]
# 第四轮增强：DNS/邮件检查（SPF/DKIM/DMARC）
dns = ["dnspython>=2.4"]
# 第九轮：可选渲染层（JS 渲染旁路）
crawl4ai = ["crawl4ai>=0.6"]

[tool.setuptools]
packages = ["geosentry"]
